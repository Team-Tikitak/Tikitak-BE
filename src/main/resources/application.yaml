# 공통(개발/배포) 설정 파일
spring:
  application:
    name: tikitak

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://tikitak.space,https://tikitak-fe.vercel.app}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

springdoc:
  default-flat-param-object: true

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

auth:
  oauth:
    frontend-redirect-uri: ${FRONTEND_REDIRECT_URI}
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expires-in: ${JWT_ACCESS_TOKEN_EXPIRES_IN:3600}
    refresh-token-expires-in: ${JWT_REFRESH_TOKEN_EXPIRES_IN:604800}
    cookie-secure: ${REFRESH_COOKIE_SECURE:true}

r2:
  account-id: ${R2_ACCOUNT_ID}
  region: ${R2_REGION:auto}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  bucket-name: ${R2_BUCKET_NAME}
  endpoint: ${R2_ENDPOINT}
  public-base-url: ${R2_PUBLIC_BASE_URL:}

image:
  optimization:
    enabled: ${IMAGE_OPTIMIZATION_ENABLED:true}
    preset-query-param: ${IMAGE_OPTIMIZATION_PRESET_QUERY_PARAM:preset}

kakao:
  map:
    rest-api-key: ${KAKAO_MAP_REST_API_KEY}
