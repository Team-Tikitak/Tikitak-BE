# 공통(개발/배포) 설정 파일
spring:
  application:
    name: tikitak

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://tikitak.space,https://app.tikitak.space,https://tikitak-fe.vercel.app,capacitor://tikitak.space}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

springdoc:
  default-flat-param-object: true

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

auth:
  oauth:
    frontend-redirect-uri: ${FRONTEND_REDIRECT_URI}
    state:
      redis-key-prefix: "${OAUTH_STATE_REDIS_KEY_PREFIX:tikitak:${spring.profiles.active:local}:oauth:state:}"
      ttl: ${OAUTH_STATE_TTL:PT5M}
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI}
    apple:
      client-id: ${APPLE_CLIENT_ID}
      team-id: ${APPLE_TEAM_ID}
      key-id: ${APPLE_KEY_ID}
      private-key: ${APPLE_PRIVATE_KEY}
      redirect-uri: ${APPLE_REDIRECT_URI}
  login-code:
    redis-key-prefix: "${LOGIN_CODE_REDIS_KEY_PREFIX:tikitak:${spring.profiles.active:local}:auth:login-code:}"
    ttl: ${LOGIN_CODE_TTL:PT5M}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expires-in: ${JWT_ACCESS_TOKEN_EXPIRES_IN:3600}
    refresh-token-expires-in: ${JWT_REFRESH_TOKEN_EXPIRES_IN:604800}
    cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    cookie-domain: ${REFRESH_COOKIE_DOMAIN:}

r2:
  account-id: ${R2_ACCOUNT_ID}
  region: ${R2_REGION:auto}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  bucket-name: ${R2_BUCKET_NAME}
  endpoint: ${R2_ENDPOINT}
  public-base-url: ${R2_PUBLIC_BASE_URL:}

image:
  optimization:
    enabled: ${IMAGE_OPTIMIZATION_ENABLED:true}
    preset-query-param: ${IMAGE_OPTIMIZATION_PRESET_QUERY_PARAM:preset}

kakao:
  map:
    rest-api-key: ${KAKAO_MAP_REST_API_KEY}

firebase:
  credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
