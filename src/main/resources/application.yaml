# 공통(개발/배포) 설정 파일
spring:
  application:
    name: tikitak

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

springdoc:
  default-flat-param-object: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

auth:
  oauth:
    frontend-redirect-uri: ${FRONTEND_REDIRECT_URI}
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expires-in: ${JWT_ACCESS_TOKEN_EXPIRES_IN:3600}
    refresh-token-expires-in: ${JWT_REFRESH_TOKEN_EXPIRES_IN:604800}
    cookie-secure: ${REFRESH_COOKIE_SECURE:true}
