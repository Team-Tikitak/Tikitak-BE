name: CD

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-push-update-gitops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set deploy variables
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER_LC}/tikitak-be" >> $GITHUB_ENV

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "DEPLOY_ENV=prod" >> $GITHUB_ENV
          elif [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "DEPLOY_ENV=dev" >> $GITHUB_ENV
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ${IMAGE_NAME}:${GITHUB_SHA} \
            -t ${IMAGE_NAME}:${GITHUB_REF_NAME} \
            .

      - name: Push Docker image
        run: |
          docker push ${IMAGE_NAME}:${GITHUB_SHA}
          docker push ${IMAGE_NAME}:${GITHUB_REF_NAME}

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Tikitak-GitOps
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update docker-compose image tag
        run: |
          COMPOSE_FILE="gitops/${DEPLOY_ENV}/docker-compose.yaml"

          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "docker-compose.yaml not found: $COMPOSE_FILE"
            exit 1
          fi

          sed -i "s|image: ghcr.io/.*/tikitak-be:.*|image: ${IMAGE_NAME}:${GITHUB_SHA}|g" "$COMPOSE_FILE"

      - name: Commit and push GitOps change
        run: |
          cd gitops

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ${DEPLOY_ENV}/docker-compose.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit"
            exit 0
          fi

          git commit -m "deploy(${DEPLOY_ENV}): ${GITHUB_SHA}"
          git push