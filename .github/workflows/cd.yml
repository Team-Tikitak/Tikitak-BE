name: CD

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-push-update-gitops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set deploy variables
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER_LC}/tikitak-be" >> $GITHUB_ENV

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "DEPLOY_ENV=prod" >> $GITHUB_ENV
            echo "KOMODO_WEBHOOK_URL=${{ secrets.KOMODO_PROD_WEBHOOK_URL }}" >> $GITHUB_ENV
          elif [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "DEPLOY_ENV=dev" >> $GITHUB_ENV
            echo "KOMODO_WEBHOOK_URL=${{ secrets.KOMODO_DEV_WEBHOOK_URL }}" >> $GITHUB_ENV
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ${IMAGE_NAME}:${GITHUB_SHA} \
            -t ${IMAGE_NAME}:${GITHUB_REF_NAME} \
            .

      - name: Push Docker image
        run: |
          docker push ${IMAGE_NAME}:${GITHUB_SHA}
          docker push ${IMAGE_NAME}:${GITHUB_REF_NAME}

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Tikitak-GitOps
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update docker-compose image tag
        run: |
          COMPOSE_FILE="gitops/${DEPLOY_ENV}/docker-compose.yaml"

          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "docker-compose.yaml not found: $COMPOSE_FILE"
            exit 1
          fi

          sed -i "s|image: ghcr.io/.*/tikitak-be:.*|image: ${IMAGE_NAME}:${GITHUB_SHA}|g" "$COMPOSE_FILE"

      - name: Commit and push GitOps change
        id: gitops
        run: |
          cd gitops

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ${DEPLOY_ENV}/docker-compose.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "deploy(${DEPLOY_ENV}): ${GITHUB_SHA}"
          git push

          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Trigger Komodo stack redeploy
        if: steps.gitops.outputs.changed == 'true'
        run: |
          BODY=$(cat <<EOF
          {
            "ref": "refs/heads/main",
            "after": "${GITHUB_SHA}",
            "repository": {
              "full_name": "${GITHUB_REPOSITORY_OWNER}/Tikitak-GitOps"
            },
            "sender": {
              "login": "${GITHUB_ACTOR}"
            }
          }
          EOF
          )

          SIGNATURE=$(BODY="$BODY" KOMODO_WEBHOOK_SECRET="${{ secrets.KOMODO_WEBHOOK_SECRET }}" python3 - <<'PY'
          import os, hmac, hashlib
          body = os.environ["BODY"].encode("utf-8")
          secret = os.environ["KOMODO_WEBHOOK_SECRET"].encode("utf-8")
          print("sha256=" + hmac.new(secret, body, hashlib.sha256).hexdigest())
          PY
          )

          curl -fsS -X POST "$KOMODO_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$BODY"

          echo ""
          echo "Komodo ${DEPLOY_ENV} redeploy triggered"