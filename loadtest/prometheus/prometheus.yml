# 부하 측정용 로컬 Prometheus 설정 (#217)
# 호스트에서 jar로 도는 앱의 management 포트(MANAGEMENT_SERVER_PORT=8081, loadtest/.env)를 1초 간격으로 수집한다.
# job 이름(tikitak-loadtest)은 Grafana 대시보드의 Environment($job) 변수 값이다. 바꾸면 대시보드 기본값도 같이 바꾼다.
global:
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tikitak-loadtest
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
